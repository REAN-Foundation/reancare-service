
name: Harbor-UAT-GHR

on:
  push:
    branches:
      - 'release/**'

jobs:
  Build-Push-Harbor:
    environment: uat
    runs-on: [self-hosted, linux, x64, rean-dev-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          SHA_SHORT=$(git rev-parse --short HEAD)

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Print branch details
        run: |
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "SHA: ${{ steps.vars.outputs.sha_short }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: artifacts.reanfoundation.org
          username: ${{ secrets.GHR_HARBOR_USERNAME }}
          password: ${{ secrets.GHR_HARBOR_PASSWORD }}

      - name: Build and push image to Harbor
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: |
            artifacts.reanfoundation.org/rean-dev/reancare-service-dev-uat:sb.${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
